services:
  # Gateway Service
  - type: web
    name: unisocial-gateway
    env: node
    rootDir: services/gateway
    buildCommand: cd ../../packages/shared-types && npm install --include=dev && npm run build && cd ../../services/gateway && npm install --include=dev && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: unisocial-user-service
          property: url
    # Add other env vars in the Render Dashboard Config
    
  # User Service
  - type: web
    name: unisocial-user-service
    env: node
    rootDir: services/user-service
    buildCommand: cd ../../packages/shared-types && npm install --include=dev && npm run build && cd ../../services/user-service && npm install --include=dev && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
