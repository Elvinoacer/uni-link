<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Campus Poll</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1392ec",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "card-light": "#ffffff",
                        "card-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-[480px] mx-auto min-h-screen flex flex-col relative pb-10">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center p-4 justify-between">
<button class="text-slate-500 dark:text-slate-400 flex size-10 items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center">Create Poll</h2>
<div class="flex w-10 items-center justify-end">
<button class="text-primary text-base font-bold leading-normal tracking-wide hover:opacity-80 transition-opacity">
                        Post
                    </button>
</div>
</div>
</header>
<main class="flex-1 space-y-4 pt-4 px-4">
<!-- Identity Section: ListItem variation -->
<div class="bg-card-light dark:bg-card-dark rounded-xl border border-slate-200 dark:border-slate-800 p-1">
<div class="flex items-center gap-3 px-3 py-2 justify-between cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-colors">
<div class="flex items-center gap-3">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-10 w-10 ring-2 ring-primary/10" data-alt="User profile avatar wearing a university cap" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBqUsB2VWl3Y8iSzANAP5V_j1N2VX7wsegDIXE77wz3QEio0Ehq0A_A6gw5xNdqmHstn8V5M_cpB0d6o7SSJ-CLflkHReZP0rCY4OLZZzpiTLuo_9Dq_AFCVzcx9cmqM0ghBuonKG8gJaU32Bpxn244nT9PSB2HCQBSULf7TAa7RFujwC_CGrYo3fgcjxyBsGZV0OuyDvk-XoIbjXFbUm2g940WYJaeMwxKYSXBgq6urf-xrPtlxIyllgoHxkqO4vlF7zPrfvVgziA");'>
</div>
<div>
<p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Posting as</p>
<p class="text-slate-900 dark:text-white text-sm font-semibold truncate">Alex Rivera (Student Identity)</p>
</div>
</div>
<div class="shrink-0 text-slate-400">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Question Input: TextField variation -->
<div class="bg-card-light dark:bg-card-dark rounded-xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
<label class="flex flex-col w-full">
<p class="text-slate-900 dark:text-white text-sm font-bold pb-3">Question</p>
<textarea class="form-input flex w-full resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border-0 bg-slate-50 dark:bg-slate-900/50 placeholder:text-slate-400 p-4 text-base font-medium leading-relaxed min-h-[120px]" placeholder="What's happening on campus? e.g. Best late night study spot?"></textarea>
</label>
</div>
<!-- Poll Options Section: SectionHeader & TextField -->
<div class="bg-card-light dark:bg-card-dark rounded-xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
<div class="flex items-center justify-between pb-4">
<h3 class="text-slate-900 dark:text-white text-sm font-bold uppercase tracking-wider">Poll Options</h3>
<span class="text-[10px] font-bold bg-primary/10 text-primary px-2 py-0.5 rounded-full">2/4</span>
</div>
<div class="space-y-3">
<!-- Option 1 -->
<div class="flex items-stretch rounded-lg group">
<div class="flex-1 flex items-center bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-800 focus-within:border-primary transition-colors overflow-hidden">
<span class="material-symbols-outlined text-slate-400 pl-3 text-sm">drag_indicator</span>
<input class="form-input w-full bg-transparent border-0 focus:ring-0 text-slate-900 dark:text-white h-12 px-3 text-sm font-medium" placeholder="Add option" value="Student Union Lounge"/>
<button class="text-slate-400 hover:text-red-500 px-3 transition-colors">
<span class="material-symbols-outlined text-lg">cancel</span>
</button>
</div>
</div>
<!-- Option 2 -->
<div class="flex items-stretch rounded-lg group">
<div class="flex-1 flex items-center bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-800 focus-within:border-primary transition-colors overflow-hidden">
<span class="material-symbols-outlined text-slate-400 pl-3 text-sm">drag_indicator</span>
<input class="form-input w-full bg-transparent border-0 focus:ring-0 text-slate-900 dark:text-white h-12 px-3 text-sm font-medium" placeholder="Add option" value="Main Library (Level 3)"/>
<button class="text-slate-400 hover:text-red-500 px-3 transition-colors">
<span class="material-symbols-outlined text-lg">cancel</span>
</button>
</div>
</div>
<!-- Add Option Button -->
<button class="w-full flex items-center justify-center gap-2 py-3 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-lg text-primary hover:bg-primary/5 transition-all group">
<span class="material-symbols-outlined text-lg group-hover:scale-110 transition-transform">add_circle</span>
<span class="text-sm font-bold">Add another option</span>
</button>
</div>
</div>
<!-- Poll Duration Picker -->
<div class="bg-card-light dark:bg-card-dark rounded-xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
<div class="flex items-center justify-between pb-4">
<h3 class="text-slate-900 dark:text-white text-sm font-bold uppercase tracking-wider">Poll Duration</h3>
<p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Students can vote for...</p>
</div>
<div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
<button class="shrink-0 flex flex-col items-center justify-center w-16 h-16 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 hover:border-primary transition-colors">
<span class="text-lg font-bold text-slate-900 dark:text-white">1</span>
<span class="text-[10px] font-bold text-slate-500 uppercase">Day</span>
</button>
<button class="shrink-0 flex flex-col items-center justify-center w-16 h-16 rounded-xl border-2 border-primary bg-primary/10 shadow-sm transition-colors">
<span class="text-lg font-bold text-primary">3</span>
<span class="text-[10px] font-bold text-primary uppercase">Days</span>
</button>
<button class="shrink-0 flex flex-col items-center justify-center w-16 h-16 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 hover:border-primary transition-colors">
<span class="text-lg font-bold text-slate-900 dark:text-white">5</span>
<span class="text-[10px] font-bold text-slate-500 uppercase">Days</span>
</button>
<button class="shrink-0 flex flex-col items-center justify-center w-16 h-16 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 hover:border-primary transition-colors">
<span class="text-lg font-bold text-slate-900 dark:text-white">7</span>
<span class="text-[10px] font-bold text-slate-500 uppercase">Days</span>
</button>
<button class="shrink-0 flex flex-col items-center justify-center w-16 h-16 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 hover:border-primary transition-colors">
<span class="material-symbols-outlined text-slate-400">more_time</span>
<span class="text-[10px] font-bold text-slate-500 uppercase">Custom</span>
</button>
</div>
</div>
<!-- Info Footer -->
<div class="px-4 flex items-center gap-2 text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-lg">info</span>
<p class="text-xs font-medium italic">Voters' identities remain hidden from the community.</p>
</div>
</main>
<!-- Tooltip/Helper FAB (Optional Surprise Element) -->
<div class="fixed bottom-6 right-6">
<button class="bg-primary text-white size-14 rounded-full shadow-lg shadow-primary/40 flex items-center justify-center hover:scale-105 transition-transform active:scale-95">
<span class="material-symbols-outlined">auto_awesome</span>
</button>
</div>
</div>
</body></html>
