                },
            },
        }
    </script>
<style>
        body {
            font-family: "Public Sans", sans-serif;
        }
        .soft-shadow {
            box-shadow: 0 4px 20px -2px rgba(29, 53, 93, 0.08);
        }
        .input-focus-ring:focus {
            box-shadow: 0 0 0 2px #1d355d;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center">
<!-- Top Navigation Bar -->
<div class="w-full max-w-md bg-background-light dark:bg-background-dark flex items-center p-4 pt-6 justify-between sticky top-0 z-10">
<div class="text-primary dark:text-white flex size-10 items-center justify-center rounded-full hover:bg-primary/10 transition-colors cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</div>
<h2 class="text-primary dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Verification</h2>
</div>
<main class="w-full max-w-md flex flex-col px-6 pb-12 flex-1">
<!-- Step Progress Indicator -->
<div class="flex flex-col items-center gap-2 py-6">
<span class="text-xs font-bold uppercase tracking-widest text-primary/60 dark:text-white/60">Step 2 of 3</span>
<div class="flex w-full flex-row items-center justify-center gap-2">
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-12 rounded-full bg-primary/20 dark:bg-white/20"></div>
</div>
</div>
<!-- Headline & Instructions -->
<div class="text-center mb-8">
<h1 class="text-primary dark:text-white tracking-tight text-3xl font-bold leading-tight pb-3">Verify your Email</h1>
<p class="text-slate-600 dark:text-slate-300 text-base font-normal leading-relaxed">
                We've sent a 6-digit verification code to your university email address.
            </p>
</div>
<!-- 6-Digit Code Input Group -->
<div class="flex justify-center mb-6">
<fieldset class="relative flex gap-2 sm:gap-3">
<!-- Inputs using logic from the example component but styled for the custom UI -->
<input autofocus="" class="flex h-14 w-11 sm:w-12 text-center rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-0 focus:border-primary dark:focus:border-primary text-xl font-bold text-primary dark:text-white soft-shadow [appearance:textfield] [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none" max="9" maxlength="1" min="0" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-0 focus:border-primary dark:focus:border-primary text-xl font-bold text-primary dark:text-white soft-shadow [appearance:textfield] [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none" max="9" maxlength="1" min="0" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-0 focus:border-primary dark:focus:border-primary text-xl font-bold text-primary dark:text-white soft-shadow [appearance:textfield] [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none" max="9" maxlength="1" min="0" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-0 focus:border-primary dark:focus:border-primary text-xl font-bold text-primary dark:text-white soft-shadow [appearance:textfield] [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none" max="9" maxlength="1" min="0" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-0 focus:border-primary dark:focus:border-primary text-xl font-bold text-primary dark:text-white soft-shadow [appearance:textfield] [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none" max="9" maxlength="1" min="0" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:outline-0 focus:border-primary dark:focus:border-primary text-xl font-bold text-primary dark:text-white soft-shadow [appearance:textfield] [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none" max="9" maxlength="1" min="0" type="number"/>
</fieldset>
</div>
<!-- Resend Link -->
<div class="text-center mb-10">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                Didn't receive a code? 
                <button class="text-primary dark:text-blue-400 font-bold hover:underline">Resend Code</button>
</p>
</div>
<!-- Helpful Tip Card -->
<div class="bg-accent-green/10 dark:bg-accent-green/20 border border-accent-green/20 dark:border-accent-green/30 rounded-xl p-5 mb-auto">
<div class="flex gap-3">
<span class="material-symbols-outlined text-accent-green">info</span>
<p class="text-accent-green dark:text-green-300 text-sm font-medium leading-relaxed">
<strong>Tip:</strong> Can't find the email? It might be hiding in your <span class="font-bold underline">Spam</span> or <span class="font-bold underline">Promotions</span> folder.
                </p>
</div>
</div>
<!-- Bottom Action Button -->
<div class="mt-8 pt-4">
<button class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Verify &amp; Link Account</span>
<span class="material-symbols-outlined">verified_user</span>
</button>
<p class="text-center text-slate-400 text-xs mt-4 uppercase tracking-tighter">Secure campus verification</p>
</div>
</main>
<!-- UI Decor Elements -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-blue-400 to-accent-green opacity-50"></div>
